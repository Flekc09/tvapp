org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Room 2.8 with Kotlin 2.2 (plan, Global Constraints)
ksp.useKSP2=true
# KSP 2.2.10-2.0.2 registers its generated sources through kotlin.sourceSets, which AGP 9's built-in Kotlin
# rejects by default ("Using kotlin.sourceSets DSL to add Kotlin sources is not allowed with built-in Kotlin").
android.disallowKotlinSourceSets=false
